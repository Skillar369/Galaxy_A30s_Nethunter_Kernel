name: Build Samsung A30s NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git build-essential libncurses5-dev bison flex libssl-dev bc libelf-dev ccache cpio zip

    - name: Download Proton Clang
      run: |
        git clone https://github.com/kdrag0n/proton-clang --depth=1 $GITHUB_WORKSPACE/clang

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 $GITHUB_WORKSPACE/AnyKernel3
        cd $GITHUB_WORKSPACE/AnyKernel3 && zip -r9 nethunter-kernel-a30s.zip *
      env:
        GIT_TERMINAL_PROMPT: 0

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-A30s
        path: ${{ github.workspace }}/AnyKernel3/nethunter-kernel-a30s.zip
